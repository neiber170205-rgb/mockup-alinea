<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Entrenador: avisar al grupo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mk-width" content="390">
<script src="../assets/js/mockup.js"></script>
<script src="../assets/js/dc-lite.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,400;0,500;0,600;1,800&amp;display=swap">
<style>
body{margin:0;background:#F5F3F7}
a{color:#5B3A86}a:hover{color:#3B2259}
input::placeholder,textarea::placeholder{color:#7A7085}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #6B3FA0;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;min-height:1150px;background:#F5F3F7;color:#17121D;font-family:Kanit, 'Trebuchet MS', Verdana, sans-serif;display:flex;flex-direction:column;">
<header style="background:#0F0B14;color:#FFFFFF;padding:18px 20px 22px;display:flex;flex-direction:column;gap:14px;"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;"><span style="display:flex;align-items:center;gap:10px;"><span style="display:block;width:36px;height:36px;border-radius:50%;overflow:hidden;flex:none;"><img src="../assets/img/escudo-black-panthers.jpg" alt="" style="display:block;width:104%;height:104%;margin:-2%;"></span><span style="font-weight:800;font-style:italic;text-transform:uppercase;font-size:1rem;">Black Panthers</span></span><span aria-label="Andrés, entrenador" style="width:36px;height:36px;border-radius:50%;background:#3B2259;color:#FFFFFF;font-size:0.8125rem;font-weight:600;display:flex;align-items:center;justify-content:center;">AN</span></div><div style="display:flex;flex-direction:column;gap:4px;"><h1 style="margin:0;font-weight:800;font-style:italic;text-transform:uppercase;font-size:2rem;line-height:1;">Avisar</h1><p style="margin:0;font-size:0.9375rem;color:#D9D0E2;">Les llega a las familias por WhatsApp</p></div></header>
<main style="flex:1;padding:18px 16px 24px;display:flex;flex-direction:column;gap:18px;">
<fieldset style="border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;">
<legend style="padding:0;margin-bottom:10px;font-size:1.0625rem;font-weight:600;">¿A quién?</legend>
<div style="display:flex;flex-wrap:wrap;gap:8px;"><template data-sc-for list="{{tos}}" as="t" hint-placeholder-count="4"><button type="button" onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="{{t.style}}">{{t.label}}</button></template></div>
</fieldset>
<fieldset style="border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;">
<legend style="padding:0;margin-bottom:10px;font-size:1.0625rem;font-weight:600;">Mensaje</legend>
<div style="display:flex;flex-wrap:wrap;gap:8px;"><template data-sc-for list="{{tpls}}" as="t" hint-placeholder-count="4"><button type="button" onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="{{t.style}}">{{t.label}}</button></template></div>
<label style="display:flex;flex-direction:column;gap:6px;font-size:0.9375rem;font-weight:500;margin-top:4px;">Texto del aviso
<textarea value="{{text}}" onChange="{{setText}}" rows="4" placeholder="Escribe aquí el aviso" style="padding:12px;border-radius:10px;border:1.5px solid #8E82A0;background:#FFFFFF;color:#17121D;font-family:inherit;font-size:1rem;line-height:1.45;resize:vertical;"></textarea>
</label>
</fieldset>
<section aria-label="Vista previa" style="background:#FFFFFF;border:1px solid #E4DEEA;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;">
<span style="display:flex;align-items:center;gap:8px;font-size:0.9375rem;font-weight:600;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;"><path d="M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-8l-5 4v-4H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path><path d="M8 10.5h.01M12 10.5h.01M16 10.5h.01"></path></svg>Así les llega por WhatsApp</span>
<p style="margin:0;padding:12px 14px;border-radius:12px 12px 12px 2px;background:#F1EEF4;font-size:0.9375rem;line-height:1.45;"><strong>Black Panthers</strong><br>{{preview}}<br><span style="font-size:0.8125rem;color:#5E5468;">Lo envía Andrés, entrenador</span></p>
</section>
<template data-sc-if value="{{notSent}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{send}}" style="display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border:none;border-radius:10px;background:{{accent}};color:#FFFFFF;font-family:inherit;font-size:1rem;font-weight:600;cursor:pointer;text-decoration:none;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;"><path d="M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-8l-5 4v-4H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path><path d="M8 10.5h.01M12 10.5h.01M16 10.5h.01"></path></svg>Enviar a {{n}} familias</button>
</template>
<template data-sc-if value="{{sent}}" hint-placeholder-val="{{false}}">
<p role="status" style="margin:0;display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:10px;background:#DCF2E5;color:#135C34;font-size:0.9375rem;line-height:1.45;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;"><path d="M5 12l4 4 10-10"></path></svg>Enviado por WhatsApp a {{n}} familias de {{destLabel}}. Si alguno no llega, te avisamos.</p>
</template>
<p style="margin:0;display:flex;align-items:flex-start;gap:8px;font-size:0.875rem;line-height:1.45;color:#5E5468;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;"><path d="M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-8l-5 4v-4H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path><path d="M8 10.5h.01M12 10.5h.01M16 10.5h.01"></path></svg><span>El admin del club ve todos los avisos que mandas.</span></p>
</main>
<nav aria-label="Menú del entrenador" style="display:flex;border-top:1px solid #E4DEEA;background:#FFFFFF;">
<a href="Entrenador-Inicio.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;color:#5E5468;text-decoration:none;font-size:0.8125rem;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;"><path d="M4 11l8-7 8 7"></path><path d="M6 10v10h12V10"></path></svg>Inicio</a>
<a href="Entrenador-Asistencia.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;color:#5E5468;text-decoration:none;font-size:0.8125rem;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;"><rect x="5" y="4" width="14" height="17" rx="2"></rect><path d="M9 4h6v3H9z"></path><path d="M9 14l2 2 4-4"></path></svg>Asistencia</a>
<a href="Entrenador-Grupo.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;color:#5E5468;text-decoration:none;font-size:0.8125rem;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"></path><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M21.5 20c0-2.9-1.8-5.3-4.3-6.2"></path></svg>Grupo</a>
<a href="Entrenador-Avisar.html" aria-current="page" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;color:#3B2259;text-decoration:none;font-size:0.8125rem;font-weight:600;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;"><path d="M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-8l-5 4v-4H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path><path d="M8 10.5h.01M12 10.5h.01M16 10.5h.01"></path></svg>Avisar</a>
<a href="Entrenador-Convocatoria.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;color:#5E5468;text-decoration:none;font-size:0.8125rem;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;"><path d="M8 21h8M12 17v4"></path><path d="M7 4h10v5a5 5 0 0 1-10 0z"></path></svg>Torneos</a>
</nav></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6B3FA0","options":["#6B3FA0","#8B3FD9","#7A4C9E"]},"$preview":{"width":390,"height":1150}}'>
const TO = [
  { id: 'juv', label: 'Juvenil', n: 14 }, { id: 'inf', label: 'Infantil', n: 13 }, { id: 'may', label: 'Mayores', n: 16 },
  { id: 'conv', label: 'Convocadas Copa Oriente', n: 12 },
];
const TPL = [
  { id: 'cancela', label: 'Se cancela el entreno', text: 'Hola, el entreno de hoy se cancela por lluvia. Nos vemos el jueves a la misma hora.' },
  { id: 'hora', label: 'Cambio de hora', text: 'Hola, el entreno del jueves empieza a las 5:00 p. m. y no a las 4:30. Gracias por estar pendientes.' },
  { id: 'llevar', label: 'Qué llevar', text: 'Hola, para el sábado traigan uniforme blanco, rodilleras e hidratación.' },
  { id: 'otro', label: 'Escribir otro', text: '' },
];
const chip = (on) => 'display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:999px;font-family:inherit;font-size:0.9375rem;cursor:pointer;' + (on ? 'background:#3B2259;color:#FFFFFF;border:1.5px solid #3B2259;font-weight:500;' : 'background:#FFFFFF;color:#17121D;border:1.5px solid #C9BED6;');

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { to: 'juv', tpl: 'cancela', text: TPL[0].text, sent: false }; }
  renderVals() {
    const accent = this.props.accent ?? '#6B3FA0';
    const { to, tpl, text, sent } = this.state;
    const dest = TO.find((t) => t.id === to);
    return {
      accent, text, sent, notSent: !sent, n: dest.n, destLabel: dest.label,
      setText: (e) => this.setState({ text: e.target.value, sent: false }),
      tos: TO.map((t) => ({ ...t, on: t.id === to, style: chip(t.id === to), pick: () => this.setState({ to: t.id, sent: false }) })),
      tpls: TPL.map((t) => ({ ...t, on: t.id === tpl, style: chip(t.id === tpl), pick: () => this.setState({ tpl: t.id, text: t.text, sent: false }) })),
      preview: text.trim() ? text : 'Escribe el mensaje para ver cómo llega.',
      send: () => this.setState({ sent: true }),
    };
  }
}
</script>
</body>
</html>
