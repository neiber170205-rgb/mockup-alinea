<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Portal del acudiente: perfil</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mk-width" content="390">
<script src="../assets/js/mockup.js"></script>
<script src="../assets/js/dc-lite.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,400;0,500;0,600;1,800&amp;display=swap">
<style>
body{margin:0;background:#F5F3F7}
a{color:#5B3A86}a:hover{color:#3B2259}
a:focus-visible,button:focus-visible{outline:3px solid #6B3FA0;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;min-height:1300px;background:#F5F3F7;color:#17121D;font-family:Kanit, 'Trebuchet MS', Verdana, sans-serif;display:flex;flex-direction:column;">

<header style="background:#0F0B14;color:#FFFFFF;padding:18px 20px 22px;display:flex;flex-direction:column;gap:14px;">
<div style="display:flex;align-items:center;gap:10px;">
<span style="display:block;width:36px;height:36px;border-radius:50%;overflow:hidden;flex:none;"><img src="../assets/img/escudo-black-panthers.jpg" alt="" style="display:block;width:104%;height:104%;margin:-2%;"></span>
<span style="font-weight:800;font-style:italic;text-transform:uppercase;font-size:1rem;">Black Panthers</span>
</div>
<h1 style="margin:0;font-weight:800;font-style:italic;text-transform:uppercase;font-size:2rem;line-height:1;">Perfil</h1>
</header>

<main style="flex:1;padding:18px 16px 24px;display:flex;flex-direction:column;gap:14px;">

<section aria-label="Tus datos" style="background:#FFFFFF;border:1px solid #E4DEEA;border-radius:14px;padding:16px;display:flex;align-items:center;gap:14px;">
<span style="flex:none;width:56px;height:56px;border-radius:50%;background:#3B2259;color:#FFFFFF;font-size:1.125rem;font-weight:600;display:flex;align-items:center;justify-content:center;">MR</span>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;">
<h2 style="margin:0;font-size:1.125rem;font-weight:600;">Martha Rojas</h2>
<span style="font-size:0.9375rem;color:#5E5468;font-variant-numeric:tabular-nums;">310 555 0142</span>
<span style="font-size:0.9375rem;color:#5E5468;">martha.rojas@correo.com</span>
</div>
<a href="#" style="flex:none;display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border-radius:8px;border:1.5px solid #C9BED6;color:#17121D;text-decoration:none;font-size:0.875rem;font-weight:500;">Editar</a>
</section>

<section aria-label="Tus jugadoras" style="display:flex;flex-direction:column;gap:10px;">
<h2 style="margin:0;font-size:1.0625rem;font-weight:600;">Tus jugadoras</h2>
<template data-sc-for list="{{kids}}" as="k" hint-placeholder-count="2">
<div style="background:#FFFFFF;border:1px solid #E4DEEA;border-radius:14px;overflow:hidden;">
<div style="display:flex;align-items:center;gap:12px;padding:14px 16px;">
<span style="flex:none;width:44px;height:44px;border-radius:50%;background:#EDE7F3;color:#3B2259;font-weight:600;display:flex;align-items:center;justify-content:center;">{{k.ini}}</span>
<span style="flex:1;display:flex;flex-direction:column;"><span style="font-weight:600;">{{k.name}}</span><span style="font-size:0.875rem;color:#5E5468;">{{k.cat}} · Camiseta {{k.num}}</span></span>
</div>
<a href="#" style="display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;padding:0 16px;border-top:1px solid #EEE9F2;color:#17121D;text-decoration:none;font-size:0.9375rem;">Ficha médica<span style="display:inline-flex;padding:3px 8px;border-radius:6px;background:{{k.medBg}};color:{{k.medFg}};font-size:0.8125rem;font-weight:500;">{{k.med}}</span></a>
<a href="#" style="display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;padding:0 16px;border-top:1px solid #EEE9F2;color:#17121D;text-decoration:none;font-size:0.9375rem;">Autorización de fotos<span style="display:inline-flex;padding:3px 8px;border-radius:6px;background:#DCF2E5;color:#135C34;font-size:0.8125rem;font-weight:500;">Firmada</span></a>
<a href="#" style="display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;padding:0 16px;border-top:1px solid #EEE9F2;color:#17121D;text-decoration:none;font-size:0.9375rem;">Autorización de datos<span style="display:inline-flex;padding:3px 8px;border-radius:6px;background:#DCF2E5;color:#135C34;font-size:0.8125rem;font-weight:500;">Firmada</span></a>
</div>
</template>
</section>

<section aria-label="Mensajes por WhatsApp" style="background:#FFFFFF;border:1px solid #E4DEEA;border-radius:14px;overflow:hidden;">
<div style="display:flex;align-items:flex-start;gap:10px;padding:14px 16px 10px;">
<span style="flex:none;width:36px;height:36px;border-radius:10px;background:#EDE7F3;color:#3B2259;display:flex;align-items:center;justify-content:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;"><path d="M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-8l-5 4v-4H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path><path d="M8 10.5h.01M12 10.5h.01M16 10.5h.01"></path></svg></span>
<div style="display:flex;flex-direction:column;gap:2px;">
<h2 style="margin:0;font-size:1rem;font-weight:600;">Qué te llega por WhatsApp</h2>
<p style="margin:0;font-size:0.875rem;color:#5E5468;">Los recibos de pago te llegan siempre</p>
</div>
</div>
<ul style="list-style:none;margin:0;padding:0;">
<template data-sc-for list="{{prefs}}" as="p" hint-placeholder-count="4">
<li style="display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid #EEE9F2;">
<span id="{{p.id}}" style="flex:1;font-size:0.9375rem;">{{p.name}}</span>
<button type="button" role="switch" aria-checked="{{p.checked}}" aria-labelledby="{{p.id}}" onClick="{{p.toggle}}" style="flex:none;width:52px;height:32px;padding:3px;border:none;border-radius:999px;background:{{p.track}};cursor:pointer;display:flex;justify-content:{{p.justify}};box-sizing:border-box;"><span style="display:block;width:26px;height:26px;border-radius:50%;background:#FFFFFF;"></span></button>
</li>
</template>
</ul>
</section>

<section aria-label="Cuenta" style="background:#FFFFFF;border:1px solid #E4DEEA;border-radius:14px;overflow:hidden;">
<a href="#" style="display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 16px;color:#17121D;text-decoration:none;font-size:0.9375rem;">Cambiar contraseña<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A7085" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
<a href="#" style="display:flex;align-items:center;gap:10px;min-height:52px;padding:0 16px;border-top:1px solid #EEE9F2;color:#17121D;text-decoration:none;font-size:0.9375rem;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;"><path d="M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-8l-5 4v-4H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path><path d="M8 10.5h.01M12 10.5h.01M16 10.5h.01"></path></svg><span style="flex:1;">Escribir al club por WhatsApp</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A7085" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
<a href="Login.html" style="display:flex;align-items:center;gap:10px;min-height:52px;padding:0 16px;border-top:1px solid #EEE9F2;color:#8F1D17;text-decoration:none;font-size:0.9375rem;font-weight:500;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"></path><path d="M10 16l-4-4 4-4M6 12h10"></path></svg>Cerrar sesión</a>
</section>
</main>

<nav aria-label="Menú del portal" style="display:flex;border-top:1px solid #E4DEEA;background:#FFFFFF;">
<a href="Acudiente-Inicio.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;color:#5E5468;text-decoration:none;font-size:0.8125rem;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7"></path><path d="M6 10v10h12V10"></path></svg>Inicio</a>
<a href="Acudiente-Pagos.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;color:#5E5468;text-decoration:none;font-size:0.8125rem;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="13" rx="2"></rect><circle cx="12" cy="12.5" r="2.5"></circle></svg>Pagos</a>
<a href="Acudiente-Torneos.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;color:#5E5468;text-decoration:none;font-size:0.8125rem;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4"></path><path d="M7 4h10v5a5 5 0 0 1-10 0z"></path></svg>Torneos</a>
<a href="Acudiente-Carne.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;color:#5E5468;text-decoration:none;font-size:0.8125rem;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="11" r="2"></circle><path d="M6 16c.6-1.5 1.7-2 3-2s2.4.5 3 2M15 10h3M15 13h3"></path></svg>Carné</a>
<a href="Acudiente-Perfil.html" aria-current="page" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;color:#3B2259;text-decoration:none;font-size:0.8125rem;font-weight:600;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"></path></svg>Perfil</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6B3FA0","options":["#6B3FA0","#8B3FD9","#7A4C9E"]},"$preview":{"width":390,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const accent = this.props.accent ?? '#6B3FA0';
    const off = s.off || {};
    const kids = [
      { ini: 'VR', name: 'Valentina Rojas', cat: 'Juvenil', num: '10', med: 'Completa', medBg: '#DCF2E5', medFg: '#135C34' },
      { ini: 'AR', name: 'Ana Lucía Rojas', cat: 'Infantil', num: '7', med: 'Falta la EPS', medBg: '#FCEFCF', medFg: '#6E4700' }
    ];
    const prefs = [
      ['ap-1', 'Recordatorios de pago'], ['ap-2', 'Avisos del club'], ['ap-3', 'Si falta a un entreno'], ['ap-4', 'Convocatorias a torneos']
    ].map((p) => {
      const on = !off[p[0]];
      return {
        id: p[0], name: p[1], checked: on ? 'true' : 'false',
        track: on ? '#1F7A47' : '#8E82A0', justify: on ? 'flex-end' : 'flex-start',
        toggle: () => this.setState({ off: Object.assign({}, off, { [p[0]]: on }) })
      };
    });
    return { accent: accent, kids: kids, prefs: prefs };
  }
}
</script>
</body>
</html>
